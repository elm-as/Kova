<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#neon-cyan)" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Geometric Hexagon / AI Core -->
  <path d="M256 96L394.5 176V336L256 416L117.5 336V176L256 96Z" stroke="url(#neon-cyan)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Scanning Checkmark + AI Nodes -->
  <path d="M192 256L240 304L336 192" stroke="url(#neon-pink)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Neural Connection Dots -->
  <circle cx="256" cy="96" r="16" fill="#06b6d4"/>
  <circle cx="394.5" cy="176" r="16" fill="#3b82f6"/>
  <circle cx="394.5" cy="336" r="16" fill="#8b5cf6"/>
  <circle cx="256" cy="416" r="16" fill="#ec4899"/>
  <circle cx="117.5" cy="336" r="16" fill="#8b5cf6"/>
  <circle cx="117.5" cy="176" r="16" fill="#06b6d4"/>
</svg>
